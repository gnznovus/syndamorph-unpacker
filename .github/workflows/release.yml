name: Prepare Unpacker Release Draft

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional version for manual retries (for example v0.1.2)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: unpacker-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'gnznovus/syndamorph-unpacker' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect new version and validate release eligibility
        id: gate
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEADER=$(sed -n 's/^ \* Version: //p' syndamorph-unpacker-poc/syndamorph-unpacker-poc.php | head -n 1)
          if [[ ! "$HEADER" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable plugin version: $HEADER" >&2
            exit 1
          fi
          TAG="v$HEADER"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && -n "$REQUESTED_TAG" && "$REQUESTED_TAG" != "$TAG" ]]; then
            echo "Requested $REQUESTED_TAG but plugin header is $TAG." >&2
            exit 1
          fi
          CHANGELOG_VERSION=$(sed -nE 's/^## \[([^]]+)\].*/\1/p' syndamorph-unpacker-poc/CHANGELOG.md | head -n 1)
          if [[ "$CHANGELOG_VERSION" != "$HEADER" ]]; then
            echo "Top changelog version $CHANGELOG_VERSION does not match $HEADER." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$EVENT_NAME" == 'push' ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG exists; unchanged version, no draft created." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Release $TAG already exists; refusing overwrite." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}")
            if [[ "$EVENT_NAME" == 'push' ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Tag $TAG exists at $TAG_COMMIT; manual dispatch required to retry a missing draft." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG exists on a different commit: $TAG_COMMIT." >&2
              exit 1
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Preparing $TAG from $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
      - name: Test and package exact plugin contents
        if: steps.gate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          find syndamorph-unpacker-poc tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tests/import-test.php
          php tests/updater-test.php
          python3 scripts/package_release.py . dist/syndamorph-unpacker-poc.zip "${TAG#v}"
          (cd dist && sha256sum --check syndamorph-unpacker-poc.zip.sha256)

      - name: Create tag automatically after successful validation
        if: steps.gate.outputs.skip == 'false'
        env:
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            [[ "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" ]] || exit 1
            echo "Using validated tag $TAG."
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$TAG" -m "Unpacker $TAG"
            git push origin "refs/tags/$TAG"
          fi
          # Resolve annotated or lightweight remote tags to the validated commit.
          REMOTE_COMMIT=$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')
          if [[ -z "$REMOTE_COMMIT" ]]; then
            REMOTE_COMMIT=$(git ls-remote origin "refs/tags/$TAG" | awk '{print $1}')
          fi
          [[ "$REMOTE_COMMIT" == "$GITHUB_SHA" ]] || { echo 'Remote tag SHA mismatch.' >&2; exit 1; }

      - name: Create unpublished release draft with verified ZIP
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no overwrite permitted." >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/syndamorph-unpacker-poc.zip \
            dist/syndamorph-unpacker-poc.zip.sha256 \
            --verify-tag --draft --title "Unpacker $TAG" \
            --notes "Standalone SyndaMorph Unpacker $TAG. Tested plugin package; WordPress-owned patterns and local archives remain independent of the plugin."
          gh release view "$TAG" --json isDraft,isPrerelease,tagName,assets \
            --jq '(.isDraft == true) and (.isPrerelease == false) and (.tagName == "'"${TAG}"'") and (([.assets[].name] | sort) == ["syndamorph-unpacker-poc.zip", "syndamorph-unpacker-poc.zip.sha256"])' \
            | grep -qx true
          {
            echo "### Release draft ready: $TAG"
            echo "Tagged commit: \`$GITHUB_SHA\`"
            echo "Tests, package and checksum validated. Publish only after review."
          } >> "$GITHUB_STEP_SUMMARY"
